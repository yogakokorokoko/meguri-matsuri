name: Sync YouTube videos

on:
  schedule:
    - cron: "10 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync latest YouTube uploads
        run: node scripts/sync-youtube.js
        env:
          YOUTUBE_CHANNEL_ID: UCTF2K44Nh-80anjyVuCbJxQ
          YOUTUBE_TITLE_KEYWORDS: ""

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.js index.html eguri-matsuri めぐり祭り 巡り祭
          if git diff --cached --quiet; then
            echo "No new YouTube videos."
          else
            git commit -m "Auto add latest YouTube videos"
            git push
          fi
